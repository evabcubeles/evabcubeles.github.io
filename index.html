<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Apuntes digitales para ciclos formativos de la familia profesional de Informática."
  >

  <title>Apuntes de Informática</title>
  <link rel="icon" type="image/png" href="/img/favicon.png?v=1">
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

  <!-- Barra superior -->
  <header class="navbar">

    <a class="inicio" href="index.html">
      <img
        src="img/profesora-castana.png?v=2"
        alt=""
        class="icono-profesora"
      >
      <span>Inicio</span>
    </a>

    <!-- Los módulos activos aparecerán aquí automáticamente -->
    <nav
      id="menuModulos"
      class="menu-modulos"
      aria-label="Módulos formativos"
    ></nav>

    <button
      id="botonTema"
      class="boton-tema"
      type="button"
      aria-label="Cambiar entre modo claro y oscuro"
      title="Cambiar tema"
    >
      ☀️
    </button>

  </header>

  <main>

    <!-- Presentación -->
    <section class="presentacion">

      <div class="presentacion-contenido">

        <h1>Apuntes de Informática</h1>

        <p>
          Apuntes digitales para módulos de Informática de Formación Profesional.
        </p>

      </div>

    </section>

    <!-- Tarjetas de los módulos activos -->
    <section class="seccion-modulos">

      <h2>Módulos formativos</h2>

      <div
        id="listaModulos"
        class="rejilla-modulos"
      ></div>

    </section>

  </main>

  <footer class="footer">
    <p>
      Material elaborado por
      <strong>Eva Ballestero Cubeles</strong>
      · Licencia
      <span class="licencia">CC BY-NC-SA 4.0</span>
      <a
        class="enlace-licencia"
        href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es"
        target="_blank"
        rel="license noopener noreferrer"
        aria-label="Licencia Creative Commons BY-NC-SA 4.0"
      >
        <img
          class="icono-licencia"
          src="img/licencias/cc-by-nc-sa.png"
          alt="Licencia Creative Commons">
      </a>
    </p>
  </footer>
  
  <!-- Es importante mantener este orden -->
  <script src="js/modulos.js"></script>
  <script src="js/inicio.js"></script>

</body>

</html>
