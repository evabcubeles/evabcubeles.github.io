<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="4.8 - El método forEach()."
  >

  <title>4.8 - El método forEach()</title>

  <link rel="icon" type="image/png" href="../../../img/favicon.png?v=5">
  <link rel="stylesheet" href="../../../css/estilos.css">

  <style>

    /* ==========================================
       ESTRUCTURA DE LA UT
    ========================================== */

    .pagina-ut {
      display: grid;
      grid-template-columns: 280px 1fr 260px;
      min-height: calc(100vh - 68px);
    }


    /* ==========================================
       COLUMNA IZQUIERDA
    ========================================== */

    .sidebar {
      border-right: 1px solid var(--borde);
      background-color: var(--fondo-pagina);

      padding: 12px 10px 30px;

      position: sticky;
      top: 68px;

      height: calc(100vh - 68px);
      overflow-y: auto;
    }

    .sidebar-modulo {
      display: block;
      margin-bottom: 8px;
      padding: 8px 14px;

      color: #626873;

      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;

      text-decoration: none;
      border-radius: 6px;

      transition:
        color 0.2s ease,
        background-color 0.2s ease;
    }

    .sidebar-modulo:hover {
      color: var(--verde-principal);
      background-color: #f3f4f6;
    }

    body.modo-oscuro .sidebar-modulo:hover {
      background-color: #273244;
    }


    /* ==========================================
       MENÚ LATERAL DESPLEGABLE
    ========================================== */

    .menu-desplegable {
      width: 100%;
    }

    .menu-cabecera {
      display: flex;
      align-items: center;
      gap: 4px;

      width: 100%;

      border-radius: 6px;
    }

    .menu-cabecera-activa {
      background-color: #f1f1f1;
    }

    .menu-cabecera-activa > .menu-titulo {
      color: var(--verde-principal);
    }

    .menu-titulo {
      flex: 1;

      display: block;

      padding: 11px 8px 11px 14px;

      color: #626873;

      font-size: 16px;
      font-weight: 650;
      line-height: 1.4;

      text-decoration: none;
    }

    .menu-titulo:hover {
      color: var(--verde-principal);
    }

    .boton-desplegar {
      width: 36px;
      height: 36px;

      margin-right: 5px;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border: 0;
      border-radius: 6px;

      background: transparent;

      color: #777;

      font-family: inherit;
      font-size: 24px;
      line-height: 1;

      cursor: pointer;
    }

    .boton-desplegar:hover {
      background-color: #e5e7eb;
      color: var(--verde-principal);
    }

    .submenu {
      display: none;
    }

    .submenu.submenu-abierto {
      display: block;
    }

    .menu-apartado {
      margin-left: 14px;
    }

    .menu-apartado .menu-titulo {
      padding-top: 9px;
      padding-bottom: 9px;

      font-size: 15px;
      font-weight: 600;
    }

    .enlace-apartado-simple {
      display: block;

      margin-left: 14px;
      padding: 10px 14px;

      color: #626873;

      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;

      text-decoration: none;

      border-radius: 6px;
    }

    .enlace-apartado-simple:hover {
      background-color: #f3f4f6;
      color: var(--verde-principal);
    }

    .submenu-apartados {
      margin: 2px 0 5px 28px;
      border-left: 2px solid #e0e3e7;
    }

    .submenu-apartados a {
      display: block;
      padding: 7px 10px;

      color: #777d87;

      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;

      text-decoration: none;
    }

    .submenu-apartados a:hover {
      color: var(--verde-principal);
    }

    body.modo-oscuro .menu-cabecera-activa {
      background-color: #273244;
    }

    body.modo-oscuro .boton-desplegar:hover {
      background-color: #334155;
    }

    body.modo-oscuro .enlace-apartado-simple:hover {
      background-color: #273244;
    }

    body.modo-oscuro .submenu-apartados {
      border-left-color: #3a4659;
    }


    /* ==========================================
       RESTO DE UT
    ========================================== */

    .sidebar-ut-cerrada {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 13px 14px;

      color: #626873;

      text-decoration: none;

      font-size: 16px;
      font-weight: 650;
      line-height: 1.35;

      border-radius: 6px;
    }

    .sidebar-ut-cerrada:hover {
      background-color: #f3f4f6;
      color: var(--verde-principal);
    }

    body.modo-oscuro .sidebar-ut-cerrada:hover {
      background-color: #273244;
    }


    /* ==========================================
       ZONA CENTRAL
    ========================================== */

    .contenido-ut {
      padding: 28px 34px 70px;

      max-width: 1150px;
      width: 100%;
    }

    .migas {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 30px;

      font-size: 14px;
    }

    .miga-inicio {
      text-decoration: none;
      font-size: 18px;
    }

    .miga-separador {
      color: #999;
      font-size: 22px;
    }

    .miga-modulo {
      color: var(--texto-secundario);
      text-decoration: none;
    }

    .miga-modulo:hover {
      color: var(--verde-principal);
    }

    .miga-actual {
      padding: 8px 14px;

      background-color: #f3f3f3;
      border-radius: 24px;

      color: var(--verde-principal);
    }

    body.modo-oscuro .miga-actual {
      background-color: #273244;
    }

    .contenido-ut h1 {
      margin: 0 0 30px;

      font-size: clamp(38px, 5vw, 58px);
      line-height: 1.12;
    }


    /* ==========================================
       CONTENIDO
    ========================================== */

    .apartado-ut {
      margin-top: 55px;
      scroll-margin-top: 95px;
    }

    .apartado-ut h2 {
      margin: 0 0 24px;

      font-size: 32px;
      line-height: 1.2;

      scroll-margin-top: 95px;
    }

    .apartado-ut h3 {
      margin: 34px 0 16px;

      font-size: 24px;
      line-height: 1.3;
    }

    .apartado-ut p {
      margin: 0 0 18px;

      font-size: 18px;
      line-height: 1.75;
    }

    .apartado-ut ul {
      margin: 16px 0 24px;
      padding-left: 28px;
    }

    .apartado-ut li {
      margin-bottom: 10px;

      font-size: 17px;
      line-height: 1.6;
    }


    /* ==========================================
       CAJAS
    ========================================== */

    .caja {
      margin: 28px 0;
      padding: 18px 20px;

      border-left: 5px solid;
      border-radius: 8px;

      line-height: 1.65;
    }

    .caja p {
      margin: 0;
      font-size: 17px;
    }

    .caja-titulo {
      display: block;

      margin-bottom: 8px;

      font-size: 17px;
      font-weight: 700;
    }

    .caja-importante {
      background-color: #eef8f1;
      border-left-color: #2f9e5b;
    }

    .caja-atencion {
      background-color: #fff7e8;
      border-left-color: #e09b27;
    }

    .caja-ejemplo {
      background-color: #eef5ff;
      border-left-color: #3f7acb;
    }

    .caja-curiosidad {
      background-color: #f7f1ff;
      border-left-color: #8b5cc7;
    }

    body.modo-oscuro .caja-importante {
      background-color: #20372a;
    }

    body.modo-oscuro .caja-atencion {
      background-color: #3b3020;
    }

    body.modo-oscuro .caja-ejemplo {
      background-color: #23344a;
    }

    body.modo-oscuro .caja-curiosidad {
      background-color: #332944;
    }


    /* ==========================================
       TABLAS
    ========================================== */

    .tabla-responsive {
      width: 100%;
      margin: 28px 0;
      overflow-x: auto;
    }

    .tabla-apuntes {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
    }

    .tabla-apuntes th,
    .tabla-apuntes td {
      padding: 14px 16px;

      border: 1px solid var(--borde);

      text-align: left;
      vertical-align: top;

      line-height: 1.55;
    }

    .tabla-apuntes th {
      background-color: #f1f3f5;
      font-weight: 700;
    }

    body.modo-oscuro .tabla-apuntes th {
      background-color: #273244;
    }


    /* ==========================================
       ACTIVIDAD
    ========================================== */

    .actividad-reflexion {
      margin: 32px 0;
      padding: 22px 24px;

      background-color: #f7f8fa;

      border: 1px solid var(--borde);
      border-radius: 10px;
    }

    .actividad-reflexion h3 {
      margin: 0 0 12px;

      color: var(--verde-principal);

      font-size: 20px;
    }

    .actividad-reflexion p {
      margin: 0 0 14px;

      font-size: 17px;
      line-height: 1.65;
    }

    body.modo-oscuro .actividad-reflexion {
      background-color: #232d3d;
    }


    /* ==========================================
       SOLUCIÓN
    ========================================== */

    .solucion-desplegable {
      margin-top: 20px;
    }

    .solucion-desplegable summary {
      display: inline-block;

      padding: 10px 16px;

      background-color: #eef8f1;

      border: 1px solid #b9dfc6;
      border-radius: 7px;

      color: var(--verde-principal);

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
      user-select: none;
    }

    .solucion-desplegable summary:hover {
      background-color: #e2f3e7;
    }

    .contenido-solucion {
      margin-top: 16px;
      padding: 18px 20px;

      background-color: var(--fondo-pagina);

      border-left: 4px solid var(--verde-principal);
      border-radius: 6px;
    }

    .contenido-solucion p {
      margin: 0 0 12px;

      font-size: 16px;
      line-height: 1.65;
    }

    body.modo-oscuro .solucion-desplegable summary {
      background-color: #20372a;
      border-color: #315d40;
    }


    /* ==========================================
       BLOQUES DE CÓDIGO
    ========================================== */

    .bloque-codigo {
      margin: 28px 0;

      border: 1px solid #3b3b3b;
      border-radius: 9px;

      overflow: hidden;

      background-color: #1e1e1e;
    }

    .cabecera-codigo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 10px 14px;

      background-color: #2b2b2b;

      color: #f3f4f6;

      font-size: 14px;
    }

    .lenguaje-codigo {
      font-weight: 700;
    }

    .boton-copiar {
      padding: 6px 11px;

      border: 1px solid #5c5c5c;
      border-radius: 6px;

      background-color: #383838;

      color: #f3f4f6;

      font-family: inherit;
      font-size: 13px;
